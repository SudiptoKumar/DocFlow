name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Also create a GitHub Release and attach the APK"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag (used only when create_release is enabled)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  GRADLE_VERSION: "9.6.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK and run unit tests
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ inputs.create_release && inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: DocFlow ${{ inputs.release_tag }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
