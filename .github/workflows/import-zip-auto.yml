name: Auto Import Project ZIP

on: push: paths: - “*.zip” workflow_dispatch:

permissions: contents: write

concurrency: group: auto-import-zip cancel-in-progress: false

jobs: import-project: runs-on: ubuntu-latest

steps:
  # ============================================================
  # CHECKOUT
  # ============================================================
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0
      token: ${{ secrets.GITHUB_TOKEN }}
 
  # ============================================================
  # FIND ZIP
  # ============================================================
  - name: Find project ZIP
    id: find_zip
    shell: bash
    run: |
      set -euo pipefail
 
      mapfile -t ZIPS < <(
        find . \
          -mindepth 1 \
          -maxdepth 1 \
          -type f \
          -iname "*.zip" \
          -print
      )
 
      if [ "${#ZIPS[@]}" -eq 0 ]; then
        echo "::error::No ZIP file found in repository root."
        exit 1
      fi
 
      if [ "${#ZIPS[@]}" -gt 1 ]; then
        echo "::error::More than one ZIP file found in repository root."
        echo "Keep only one project ZIP."
        printf '%s\n' "${ZIPS[@]}"
        exit 1
      fi
 
      ZIP="${ZIPS[0]}"
 
      echo "ZIP=$ZIP" >> "$GITHUB_OUTPUT"
      echo "Found project ZIP: $ZIP"
 
  # ============================================================
  # STAGE ZIP BEFORE CLEANING
  # The repository will be cleaned after this step, so the ZIP
  # must be copied outside the repository first.
  # ============================================================
  - name: Stage ZIP
    id: stage_zip
    shell: bash
    run: |
      set -euo pipefail
 
      STAGE="/tmp/project-import"
      rm -rf "$STAGE"
      mkdir -p "$STAGE"
 
      cp "${{ steps.find_zip.outputs.ZIP }}" "$STAGE/project.zip"
 
      echo "STAGE=$STAGE" >> "$GITHUB_OUTPUT"
      echo "ZIP staged at $STAGE/project.zip"
 
  # ============================================================
  # VALIDATE ZIP
  # Prevent unsafe paths such as ../../file or absolute paths.
  # ============================================================
  - name: Validate ZIP
    shell: bash
    run: |
      set -euo pipefail
 
      ZIP="/tmp/project-import/project.zip"
 
      if unzip -tq "$ZIP" >/dev/null; then
        echo "ZIP integrity check passed."
      else
        echo "::error::ZIP file is corrupted or cannot be read."
        exit 1
      fi
 
      if unzip -Z1 "$ZIP" | grep -E '(^/|(^|/)\.\.(/|$))' >/dev/null; then
        echo "::error::Unsafe ZIP path detected."
        echo "Absolute paths and parent-directory traversal are not allowed."
        exit 1
      fi
 
      echo "ZIP path validation passed."
 
  # ============================================================
  # BACK UP THIS IMPORTER WORKFLOW
  # It must survive the cleanup, otherwise the automation would
  # remove its own trigger.
  # ============================================================
  - name: Preserve importer workflow
    id: preserve_workflow
    shell: bash
    run: |
      set -euo pipefail
 
      # Automatically determine the exact workflow file that started this run.
      # Example:
      #   owner/repo/.github/workflows/import-zip-auto.yml@refs/heads/main
      WORKFLOW_PATH="${GITHUB_WORKFLOW_REF#*/.github/workflows/}"
      WORKFLOW_FILE="${WORKFLOW_PATH%%@*}"
      WORKFLOW=".github/workflows/$WORKFLOW_FILE"
 
      BACKUP="/tmp/project-import/importer-workflow.yml"
 
      if [ ! -f "$WORKFLOW" ]; then
        echo "::error::Running workflow file was not found: $WORKFLOW"
        echo "GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF"
        exit 1
      fi
 
      cp "$WORKFLOW" "$BACKUP"
      echo "Importer workflow preserved: $WORKFLOW"
      echo "WORKFLOW_FILE=$WORKFLOW_FILE" >> "$GITHUB_OUTPUT"
 
  # ============================================================
  # CLEAN REPOSITORY
  #
  # Keep only:
  #   - .git
  #   - this importer workflow
  #
  # Everything else is removed before the new project is copied.
  # ============================================================
  - name: Clean repository
    shell: bash
    run: |
      set -euo pipefail
 
      echo "Cleaning repository..."
 
      find . \
        -mindepth 1 \
        -maxdepth 1 \
        ! -name ".git" \
        ! -name ".github" \
        -exec rm -rf {} +
 
      mkdir -p .github/workflows
 
      find .github \
        -mindepth 1 \
        -maxdepth 1 \
        ! -name "workflows" \
        -exec rm -rf {} +
 
      find .github/workflows \
        -mindepth 1 \
        -maxdepth 1 \
        ! -name "import-zip.yml" \
        -exec rm -rf {} +
 
      echo "Repository cleaned."
 
  # ============================================================
  # EXTRACT ZIP
  # ============================================================
  - name: Extract project ZIP
    shell: bash
    run: |
      set -euo pipefail
 
      STAGE="/tmp/project-import"
      EXTRACT="$STAGE/extracted"
 
      rm -rf "$EXTRACT"
      mkdir -p "$EXTRACT"
 
      unzip -q "$STAGE/project.zip" -d "$EXTRACT"
 
      # Remove common macOS ZIP metadata.
      rm -rf "$EXTRACT/__MACOSX"
      find "$EXTRACT" -name ".DS_Store" -delete
 
      echo "Project extracted."
 
  # ============================================================
  # DETECT PROJECT ROOT
  #
  # Supports both:
  #
  # 1. ZIP
  #    package.json
  #    src/
  #
  # 2. ZIP
  #    my-project/
  #      package.json
  #      src/
  #
  # In case #2, the wrapper folder is flattened.
  # ============================================================
  - name: Detect project root
    id: project_root
    shell: bash
    run: |
      set -euo pipefail
 
      ROOT="/tmp/project-import/extracted"
 
      mapfile -t DIRS < <(
        find "$ROOT" \
          -mindepth 1 \
          -maxdepth 1 \
          -type d \
          ! -name "__MACOSX" \
          -print
      )
 
      mapfile -t FILES < <(
        find "$ROOT" \
          -mindepth 1 \
          -maxdepth 1 \
          -type f \
          -print
      )
 
      if [ "${#DIRS[@]}" -eq 1 ] && [ "${#FILES[@]}" -eq 0 ]; then
        PROJECT_ROOT="${DIRS[0]}"
        echo "Detected single top-level project folder: $PROJECT_ROOT"
      else
        PROJECT_ROOT="$ROOT"
        echo "Detected project files directly at ZIP root."
      fi
 
      echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
 
  # ============================================================
  # IMPORT PROJECT
  #
  # The ZIP becomes the repository contents.
  # The importer workflow is restored afterward so future ZIP
  # uploads continue to trigger this workflow.
  # ============================================================
  - name: Import project files
    shell: bash
    run: |
      set -euo pipefail
 
      PROJECT_ROOT="${{ steps.project_root.outputs.PROJECT_ROOT }}"
      IMPORTER_BACKUP="/tmp/project-import/importer-workflow.yml"
 
      rsync -a --delete \
        --exclude=".git/" \
        "$PROJECT_ROOT/" ./
 
      mkdir -p .github/workflows
 
      WORKFLOW_FILE="${{ steps.preserve_workflow.outputs.WORKFLOW_FILE }}"
      cp "$IMPORTER_BACKUP" ".github/workflows/$WORKFLOW_FILE"
 
      echo "Project imported successfully."
      echo "Importer workflow restored."
 
  # ============================================================
  # DELETE ALL ZIP FILES
  # ============================================================
  - name: Delete ZIP files
    shell: bash
    run: |
      set -euo pipefail
 
      find . \
        -type f \
        -iname "*.zip" \
        -not -path "./.git/*" \
        -delete
 
      echo "All repository ZIP files deleted."
 
  # ============================================================
  # SHOW RESULT
  # ============================================================
  - name: Show imported repository
    shell: bash
    run: |
      set -euo pipefail
 
      echo ""
      echo "========================================"
      echo "IMPORT COMPLETE"
      echo "========================================"
      echo ""
      echo "Repository tree:"
      find . \
        -maxdepth 3 \
        -not -path "./.git/*" \
        -print \
        | sort
 
  # ============================================================
  # COMMIT AND PUSH
  # ============================================================
  - name: Commit and push
    shell: bash
    run: |
      set -euo pipefail
 
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
 
      git add -A
 
      if git diff --cached --quiet; then
        echo "No repository changes detected."
        exit 0
      fi
 
      git commit -m "Auto import project from ZIP"
      git push
 
      echo ""
      echo "========================================"
      echo "SUCCESS"
      echo "========================================"
      echo "Project ZIP imported and deleted."
 
